# Production-safe baseline. Provider deployments are intentionally provisioned
# outside Git; no API key or provider credential belongs in this file.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

authentication:
  admin_allowed_routes: []

litellm_settings:
  success_callback:
    - langfuse
  failure_callback:
    - langfuse
  redact_user_api_key_info: true

router_settings:
  enable_pre_call_checks: true
