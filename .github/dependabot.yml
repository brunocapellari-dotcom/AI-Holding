version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-production:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Cuiaba
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
