name: terraform-format-once

on:
  push:
    branches:
      - holding-control-plane-operational-20261007

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: holding-control-plane-operational-20261007

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Format Terraform
        run: terraform -chdir=infra/terraform fmt

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Terraform is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/terraform
          git commit -m "style: terraform fmt"
          git push
