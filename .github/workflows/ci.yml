name: ci-and-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holding_test
          POSTGRES_USER: holding
          POSTGRES_PASSWORD: holding
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U holding -d holding_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ENVIRONMENT: test
      REQUIRE_VERIFIED_IDENTITY: "false"
      DATABASE_URL: postgresql+psycopg://holding:holding@localhost:5432/holding_test
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project and development gates
        run: pip install -e '.[dev]'

      - name: Full project gate
        run: bash scripts/full_project_gate.sh

      - name: Terraform and IaC misconfiguration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: infra/terraform
          scanners: misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: holding-control-plane:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Container vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: holding-control-plane:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          skip-setup-trivy: true

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ai-holding-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ai-holding-prod-bc
      REGION: southamerica-east1
      SERVICE_NAME: holding-control-plane
      PMO_SERVICE_ACCOUNT: holding-pmo-worker@ai-holding-prod-bc.iam.gserviceaccount.com
      KNOWLEDGE_SERVICE_ACCOUNT: holding-knowledge-worker@ai-holding-prod-bc.iam.gserviceaccount.com
      MIGRATION_SERVICE_ACCOUNT: holding-db-migration@ai-holding-prod-bc.iam.gserviceaccount.com
      SCHEDULER_SERVICE_ACCOUNT: holding-worker-scheduler@ai-holding-prod-bc.iam.gserviceaccount.com
      TF_STATE_BUCKET: ai-holding-prod-bc-tfstate
      WIF_PROVIDER: projects/868946857614/locations/global/workloadIdentityPools/github-actions/providers/ai-holding-main
      DEPLOY_SERVICE_ACCOUNT: github-deployer@ai-holding-prod-bc.iam.gserviceaccount.com

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate deployer without static keys
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Initialize production state
        run: |
          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=control-plane/prod"

      - name: Complete missing database foundation without touching runtime
        run: |
          if terraform -chdir=infra/terraform state show \
            google_sql_database_instance.postgres >/dev/null 2>&1; then
            echo "Database foundation exists; preserving deployed runtime."
          else
            terraform -chdir=infra/terraform plan \
              -var-file=prod.tfvars \
              -var="deploy_service=false" \
              -target=google_sql_database_instance.postgres \
              -target=google_sql_database.holding \
              -target=google_sql_user.holding \
              -target=google_secret_manager_secret_version.database_url \
              -out=foundation.tfplan

            terraform -chdir=infra/terraform show -json foundation.tfplan \
              | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'
            terraform -chdir=infra/terraform apply -auto-approve foundation.tfplan
          fi

      - name: Recover resources tainted by interrupted deployments
        run: |
          for address in \
            'google_cloud_run_v2_service.api[0]' \
            'google_cloud_run_v2_job.migrate[0]' \
            'google_cloud_run_v2_job.bootstrap[0]' \
            'google_cloud_run_v2_job.pmo_worker[0]' \
            'google_cloud_run_v2_job.knowledge_worker[0]' \
            'google_cloud_run_v2_job.pmo_acceptance[0]' \
            'google_cloud_run_v2_job.knowledge_acceptance[0]'; do
            state="$(terraform -chdir=infra/terraform state show "${address}" 2>/dev/null || true)"
            if printf '%s\n' "${state}" | head -n 1 | grep -q '(tainted)'; then
              terraform -chdir=infra/terraform untaint "${address}"
            fi
          done

      - name: Build immutable production image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/holding/${SERVICE_NAME}:${IMAGE_TAG}"
          docker build --pull --tag "${IMAGE}" .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe \
            "${IMAGE}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "IMAGE_REF=${REGION}-docker.pkg.dev/${PROJECT_ID}/holding/${SERVICE_NAME}@${DIGEST}" \
            >> "${GITHUB_ENV}"

      - name: Plan production deployment
        run: |
          terraform -chdir=infra/terraform plan \
            -var-file=prod.tfvars \
            -var="deploy_service=true" \
            -var="image_ref=${IMAGE_REF}" \
            -out=tfplan

      - name: Reject destructive production plans
        run: |
          terraform -chdir=infra/terraform show -json tfplan \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'

      - name: Apply production deployment with one bounded retry
        run: |
          set +e
          terraform -chdir=infra/terraform apply -auto-approve tfplan
          apply_status=$?
          set -e
          if [ "${apply_status}" -eq 0 ]; then
            exit 0
          fi

          echo "Initial non-destructive apply failed; performing one bounded re-plan and retry."
          sleep 30
          terraform -chdir=infra/terraform plan \
            -var-file=prod.tfvars \
            -var="deploy_service=true" \
            -var="image_ref=${IMAGE_REF}" \
            -out=tfplan-retry
          terraform -chdir=infra/terraform show -json tfplan-retry \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'
          terraform -chdir=infra/terraform apply -auto-approve tfplan-retry

      - name: Run database migrations in private network
        run: |
          set +e
          gcloud run jobs execute "${SERVICE_NAME}-migrate" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait
          migration_status=$?
          set -e
          if [ "${migration_status}" -eq 0 ]; then
            exit 0
          fi

          latest="$(gcloud run jobs executions list \
            --job="${SERVICE_NAME}-migrate" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=1 \
            --format='value(metadata.name)' 2>/dev/null || true)"
          if [ -n "${latest}" ]; then
            gcloud run jobs executions describe "${latest}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='yaml(status.conditions,status.failedCount,status.succeededCount)' || true
          fi
          exit "${migration_status}"

      - name: Bootstrap canonical portfolio and worker identities
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-bootstrap" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

          actual_pmo_subject="$(gcloud iam service-accounts describe "${PMO_SERVICE_ACCOUNT}" \
            --project="${PROJECT_ID}" --format='value(uniqueId)')"
          expected_pmo_subject="$(terraform -chdir=infra/terraform output -raw pmo_runtime_subject)"
          test -n "${actual_pmo_subject}"
          test "${actual_pmo_subject}" = "${expected_pmo_subject}"

          actual_knowledge_subject="$(gcloud iam service-accounts describe "${KNOWLEDGE_SERVICE_ACCOUNT}" \
            --project="${PROJECT_ID}" --format='value(uniqueId)')"
          expected_knowledge_subject="$(terraform -chdir=infra/terraform output -raw knowledge_runtime_subject)"
          test -n "${actual_knowledge_subject}"
          test "${actual_knowledge_subject}" = "${expected_knowledge_subject}"

      - name: Verify least privilege and Cloud Scheduler recurrence
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          test -n "${URL}"

          policy="$(gcloud run services get-iam-policy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          printf '%s\n' "${policy}" \
            | jq -e '[.bindings[]?.members[]?] | all(. != "allUsers" and . != "allAuthenticatedUsers")'
          printf '%s\n' "${policy}" \
            | jq -e --arg member "serviceAccount:${PMO_SERVICE_ACCOUNT}" \
              'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == $member))'
          printf '%s\n' "${policy}" \
            | jq -e --arg member "serviceAccount:${KNOWLEDGE_SERVICE_ACCOUNT}" \
              'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == $member))'

          for job in "${SERVICE_NAME}-pmo-worker" "${SERVICE_NAME}-knowledge-worker"; do
            job_policy="$(gcloud run jobs get-iam-policy "${job}" \
              --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
            printf '%s\n' "${job_policy}" \
              | jq -e --arg member "serviceAccount:${SCHEDULER_SERVICE_ACCOUNT}" \
                'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == $member))'
          done

          expected_migration_service_account="$(
            terraform -chdir=infra/terraform output -raw migration_runtime_service_account
          )"
          test "${expected_migration_service_account}" = "${MIGRATION_SERVICE_ACCOUNT}"

          for scheduler in "${SERVICE_NAME}-pmo-schedule" "${SERVICE_NAME}-knowledge-schedule"; do
            scheduler_state="$(gcloud scheduler jobs describe "${scheduler}" \
              --project="${PROJECT_ID}" --location="${REGION}" --format='value(state)')"
            test "${scheduler_state}" = "ENABLED"
          done

          echo "Production Control Plane deployed at ${URL}"

      - name: Run controlled PMO production acceptance
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-pmo-acceptance" \
            --project="${PROJECT_ID}" --region="${REGION}" --args=prepare --wait

          set +e
          gcloud run jobs execute "${SERVICE_NAME}-pmo-worker" \
            --project="${PROJECT_ID}" --region="${REGION}" --wait
          worker_status=$?
          set -e

          set +e
          gcloud run jobs execute "${SERVICE_NAME}-pmo-acceptance" \
            --project="${PROJECT_ID}" --region="${REGION}" --args=finalize --wait
          acceptance_status=$?
          set -e

          if [ "${worker_status}" -ne 0 ] || [ "${acceptance_status}" -ne 0 ]; then
            gcloud run jobs logs read "${SERVICE_NAME}-pmo-worker" \
              --project="${PROJECT_ID}" --region="${REGION}" --limit=100 || true
            echo "::error title=PMO production acceptance::PMO acceptance failed closed."
            exit 30
          fi

      - name: Run controlled Knowledge IA production acceptance
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-knowledge-acceptance" \
            --project="${PROJECT_ID}" --region="${REGION}" --args=prepare --wait

          set +e
          gcloud run jobs execute "${SERVICE_NAME}-knowledge-worker" \
            --project="${PROJECT_ID}" --region="${REGION}" --wait
          worker_status=$?
          set -e

          set +e
          gcloud run jobs execute "${SERVICE_NAME}-knowledge-acceptance" \
            --project="${PROJECT_ID}" --region="${REGION}" --args=finalize --wait
          acceptance_status=$?
          set -e

          if [ "${worker_status}" -ne 0 ] || [ "${acceptance_status}" -ne 0 ]; then
            gcloud run jobs logs read "${SERVICE_NAME}-knowledge-worker" \
              --project="${PROJECT_ID}" --region="${REGION}" --limit=100 || true
            echo "::error title=Knowledge IA production acceptance::Knowledge acceptance failed closed."
            exit 31
          fi

      - name: Mark production deployment accepted
        run: |
          echo "Production deploy, migration, identity checks, PMO acceptance and Knowledge IA acceptance succeeded."
          echo "Recurring PMO and Knowledge jobs are triggered directly by Cloud Scheduler using a bounded invoker identity."
