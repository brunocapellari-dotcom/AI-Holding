name: ci-and-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holding_test
          POSTGRES_USER: holding
          POSTGRES_PASSWORD: holding
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U holding -d holding_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ENVIRONMENT: test
      REQUIRE_VERIFIED_IDENTITY: "false"
      DATABASE_URL: postgresql+psycopg://holding:holding@localhost:5432/holding_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check app tests alembic
      - name: Ruff format
        run: ruff format --check app tests alembic
      - name: Strict typing
        run: mypy app
      - name: Dependency audit
        run: pip-audit
      - name: Static security scan
        run: bandit -c pyproject.toml -r app
      - name: Database migration round trip and schema drift gate
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Test suite and coverage gate
        run: pytest
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check
      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Container build verification
        run: docker build --pull --tag holding-control-plane:ci .
      - name: Production runtime entrypoint imports
        run: |
          docker run --rm holding-control-plane:ci python -c \
            "import app.main, app.db_migrate, app.bootstrap, app.pmo_worker, app.pmo_acceptance"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: holding-control-plane:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: Container vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: holding-control-plane:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ai-holding-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ai-holding-prod-bc
      PROJECT_NUMBER: "868946857614"
      REGION: southamerica-east1
      SERVICE_NAME: holding-control-plane
      PMO_SERVICE_ACCOUNT: holding-pmo-worker@ai-holding-prod-bc.iam.gserviceaccount.com
      TF_STATE_BUCKET: ai-holding-prod-bc-tfstate
      WIF_PROVIDER: projects/868946857614/locations/global/workloadIdentityPools/github-actions/providers/ai-holding-main
      DEPLOY_SERVICE_ACCOUNT: github-deployer@ai-holding-prod-bc.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without static keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize production state
        run: |
          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=control-plane/prod"

      - name: Complete missing database foundation without touching runtime
        run: |
          if terraform -chdir=infra/terraform state show \
            google_sql_database_instance.postgres >/dev/null 2>&1; then
            echo "Database foundation exists; preserving deployed runtime."
          else
            terraform -chdir=infra/terraform plan \
              -var-file=prod.tfvars \
              -var="deploy_service=false" \
              -target=google_sql_database_instance.postgres \
              -target=google_sql_database.holding \
              -target=google_sql_user.holding \
              -target=google_secret_manager_secret_version.database_url \
              -out=foundation.tfplan

            terraform -chdir=infra/terraform show -json foundation.tfplan \
              | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'

            terraform -chdir=infra/terraform apply -auto-approve foundation.tfplan
          fi

      - name: Recover resources tainted by interrupted deployments
        run: |
          for address in \
            'google_cloud_run_v2_service.api[0]' \
            'google_cloud_run_v2_job.migrate[0]' \
            'google_cloud_run_v2_job.bootstrap[0]' \
            'google_cloud_run_v2_job.pmo_worker[0]' \
            'google_cloud_run_v2_job.pmo_acceptance[0]'; do
            state="$(terraform -chdir=infra/terraform state show "${address}" 2>/dev/null || true)"
            if printf '%s\n' "${state}" | head -n 1 | grep -q '(tainted)'; then
              terraform -chdir=infra/terraform untaint "${address}"
            fi
          done

      - name: Build immutable production image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/holding/${SERVICE_NAME}:${IMAGE_TAG}"
          docker build --pull --tag "${IMAGE}" .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe \
            "${IMAGE}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "IMAGE_REF=${REGION}-docker.pkg.dev/${PROJECT_ID}/holding/${SERVICE_NAME}@${DIGEST}" \
            >> "${GITHUB_ENV}"

      - name: Plan production deployment
        run: |
          terraform -chdir=infra/terraform plan \
            -var-file=prod.tfvars \
            -var="deploy_service=true" \
            -var="image_ref=${IMAGE_REF}" \
            -out=tfplan

      - name: Reject destructive production plans
        run: |
          terraform -chdir=infra/terraform show -json tfplan \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'

      - name: Apply production deployment with one bounded recovery attempt
        run: |
          set +e
          terraform -chdir=infra/terraform apply -auto-approve tfplan
          apply_status=$?
          set -e

          if [ "${apply_status}" -eq 0 ]; then
            exit 0
          fi

          echo "Initial apply failed after a non-destructive plan; waiting for control-plane propagation before one bounded retry."
          sleep 30
          terraform -chdir=infra/terraform plan \
            -var-file=prod.tfvars \
            -var="deploy_service=true" \
            -var="image_ref=${IMAGE_REF}" \
            -out=tfplan-retry
          terraform -chdir=infra/terraform show -json tfplan-retry \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))'
          terraform -chdir=infra/terraform apply -auto-approve tfplan-retry

      - name: Run database migrations in private network
        run: |
          set +e
          gcloud run jobs execute "${SERVICE_NAME}-migrate" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait
          migration_status=$?
          set -e

          if [ "${migration_status}" -eq 0 ]; then
            exit 0
          fi

          execution="$(gcloud run jobs executions list \
            --job="${SERVICE_NAME}-migrate" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=1 \
            --format='value(metadata.name)')"

          if [ -n "${execution}" ]; then
            gcloud run jobs executions describe "${execution}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='yaml(status.conditions,status.failedCount,status.succeededCount)' \
              || true
          fi

          run_probe() {
            probe="$1"
            set +e
            gcloud run jobs execute "${SERVICE_NAME}-migrate" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --args=-m,app.db_migrate,"${probe}" \
              --wait >/dev/null 2>&1
            probe_status=$?
            set -e
            return "${probe_status}"
          }

          if ! run_probe probe-connect; then
            echo "::error title=Production database connectivity::Migration runtime cannot connect/authenticate to the private production database."
            exit 21
          fi

          if ! run_probe probe-schema-create; then
            echo "::error title=Production database DDL permission::Database connectivity is healthy but the migration identity cannot CREATE in schema public."
            exit 20
          fi

          echo "::error title=Production migration SQL::Database connectivity and schema CREATE checks passed; Alembic migration still failed."
          exit 24

      - name: Bootstrap canonical portfolio and PMO identity binding
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-bootstrap" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

          actual_subject="$(gcloud iam service-accounts describe "${PMO_SERVICE_ACCOUNT}" \
            --project="${PROJECT_ID}" \
            --format='value(uniqueId)')"
          expected_subject="$(terraform -chdir=infra/terraform output -raw pmo_runtime_subject)"
          test -n "${actual_subject}"
          test "${actual_subject}" = "${expected_subject}"

      - name: Verify deployed service state and PMO least privilege
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          test -n "${URL}"

          policy="$(gcloud run services get-iam-policy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json)"

          printf '%s\n' "${policy}" \
            | jq -e '[.bindings[]?.members[]?] | all(. != "allUsers" and . != "allAuthenticatedUsers")'
          printf '%s\n' "${policy}" \
            | jq -e --arg member "serviceAccount:${PMO_SERVICE_ACCOUNT}" \
              'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == $member))'

          echo "Production Control Plane deployed at ${URL}"

      - name: Run controlled PMO production acceptance
        run: |
          describe_latest_execution() {
            job="$1"
            execution="$(gcloud run jobs executions list \
              --job="${job}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)' 2>/dev/null || true)"
            if [ -n "${execution}" ]; then
              gcloud run jobs executions describe "${execution}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --format='yaml(metadata.name,status.conditions,status.failedCount,status.succeededCount)' \
                || true
            fi
          }

          read_recent_job_logs() {
            job="$1"
            gcloud run jobs logs read "${job}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --limit=100 \
              || true
          }

          gcloud run jobs execute "${SERVICE_NAME}-pmo-acceptance" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args=prepare \
            --wait

          set +e
          gcloud run jobs execute "${SERVICE_NAME}-pmo-worker" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait
          worker_status=$?
          set -e

          if [ "${worker_status}" -ne 0 ]; then
            echo "PMO worker failed; collecting sanitized execution diagnostics."
            describe_latest_execution "${SERVICE_NAME}-pmo-worker"
            read_recent_job_logs "${SERVICE_NAME}-pmo-worker"
          fi

          set +e
          gcloud run jobs execute "${SERVICE_NAME}-pmo-acceptance" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args=finalize \
            --wait
          acceptance_status=$?
          set -e

          if [ "${acceptance_status}" -ne 0 ]; then
            describe_latest_execution "${SERVICE_NAME}-pmo-acceptance"
            read_recent_job_logs "${SERVICE_NAME}-pmo-acceptance"
          fi

          if [ "${worker_status}" -ne 0 ] || [ "${acceptance_status}" -ne 0 ]; then
            echo "::error title=PMO production acceptance::PMO worker acceptance failed closed; PMO is disabled by the acceptance gate."
            exit 30
          fi
