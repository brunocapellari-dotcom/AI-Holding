name: legacy-manual-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: manual-full-project-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holding_test
          POSTGRES_USER: holding
          POSTGRES_PASSWORD: holding
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U holding -d holding_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ENVIRONMENT: test
      REQUIRE_VERIFIED_IDENTITY: "false"
      DATABASE_URL: postgresql+psycopg://holding:holding@localhost:5432/holding_test

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install project and development gates
        run: python -m pip install -e '.[dev]'

      - name: Run canonical full-project gate
        run: bash scripts/full_project_gate.sh

      - name: Explain authority boundary
        run: |
          echo "This workflow is a manual diagnostic fallback only."
          echo "Canonical CI, provenance, release promotion and production deployment run in Google Cloud Build."
