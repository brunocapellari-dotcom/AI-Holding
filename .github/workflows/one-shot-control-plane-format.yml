name: one-shot-control-plane-format

on:
  push:
    branches:
      - holding-control-plane-operational-20261007

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: holding-control-plane-operational-20261007
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.12.12"
      - name: Format canonical Python files
        run: ruff format app tests alembic
      - name: Remove one-shot formatter
        run: rm -f .github/workflows/one-shot-control-plane-format.yml
      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests alembic .github/workflows/one-shot-control-plane-format.yml
          git commit -m "style: apply canonical ruff formatting [autoformat]"
          git push origin HEAD:holding-control-plane-operational-20261007
