name: autonomous-workers

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      worker:
        description: "Bounded worker to execute from main"
        required: true
        type: choice
        options:
          - pmo
          - knowledge

permissions:
  contents: read
  id-token: write

concurrency:
  group: autonomous-workers-${{ github.event.schedule || inputs.worker || 'manual' }}
  cancel-in-progress: false

jobs:
  pmo:
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch' && inputs.worker == 'pmo'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_ID: ai-holding-prod-bc
      REGION: southamerica-east1
      SERVICE_NAME: holding-control-plane
      WIF_PROVIDER: projects/868946857614/locations/global/workloadIdentityPools/github-actions/providers/ai-holding-main
      WORKER_SERVICE_ACCOUNT: holding-worker-scheduler@ai-holding-prod-bc.iam.gserviceaccount.com
    steps:
      - name: Authenticate bounded worker identity without static keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WORKER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute bounded PMO worker
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-pmo-worker" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

  knowledge:
    if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch' && inputs.worker == 'knowledge'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_ID: ai-holding-prod-bc
      REGION: southamerica-east1
      SERVICE_NAME: holding-control-plane
      WIF_PROVIDER: projects/868946857614/locations/global/workloadIdentityPools/github-actions/providers/ai-holding-main
      WORKER_SERVICE_ACCOUNT: holding-worker-scheduler@ai-holding-prod-bc.iam.gserviceaccount.com
    steps:
      - name: Authenticate bounded worker identity without static keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WORKER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute bounded Knowledge IA worker
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-knowledge-worker" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait
