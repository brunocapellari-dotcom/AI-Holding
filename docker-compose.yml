services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: holding
      POSTGRES_USER: holding
      POSTGRES_PASSWORD: holding
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holding -d holding"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://holding:holding@postgres:5432/holding
      ENVIRONMENT: development
      REQUIRE_ACTOR_HEADER: "false"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
